name: Build release APK

on:
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    if: endsWith(github.ref, '-alpha') || endsWith(github.ref, '-beta') || endsWith(github.ref, '-rc') || endsWith(github.ref, '-stable')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 tools/ci/signing.py prepare
      - name: Build release APK
        run: ./gradlew assembleLawnWithQuickstepGithubRelease bundleLawnWithQuickstepPlayRelease --no-configuration-cache --no-daemon --no-scan
      - name: Clean up signing material
        if: always()
        env:
          SIGNING_STATE: ${{ steps.signing.outputs.cleanup_state }}
        run: python3 tools/ci/signing.py cleanup
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Release APK
          if-no-files-found: error
          path: |
            build/outputs/apk/**/*.apk
            build/outputs/bundle/**/*.aab

